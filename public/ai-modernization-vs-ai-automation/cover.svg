<svg width="1730" height="909" viewBox="0 0 1730 909" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow-vs1" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1730" height="909" fill="#0d0d0d"/>
  <rect width="1730" height="909" fill="url(#glow-vs1)"/>

  <!-- left: automation, a gear, single fast arrow -->
  <g transform="translate(560,430)">
    <g fill="none" stroke="#6b7280" stroke-width="5">
      <circle cx="0" cy="0" r="70"/>
      <circle cx="0" cy="0" r="26"/>
      <g stroke-linecap="round">
        <line x1="0" y1="-95" x2="0" y2="-70"/>
        <line x1="0" y1="95" x2="0" y2="70"/>
        <line x1="-95" y1="0" x2="-70" y2="0"/>
        <line x1="95" y1="0" x2="70" y2="0"/>
        <line x1="-67" y1="-67" x2="-49" y2="-49"/>
        <line x1="67" y1="67" x2="49" y2="49"/>
        <line x1="-67" y1="67" x2="-49" y2="49"/>
        <line x1="67" y1="-67" x2="49" y2="-49"/>
      </g>
    </g>
    <text x="0" y="150" text-anchor="middle" fill="#6b7280" font-family="Arial, sans-serif" font-size="20" letter-spacing="2">AUTOMATION</text>
  </g>

  <!-- divider -->
  <text x="865" y="450" text-anchor="middle" fill="#f5f5f7" font-family="Arial, sans-serif" font-size="26" font-weight="700">vs</text>
  <line x1="865" y1="300" x2="865" y2="560" stroke="#2a2a2a" stroke-width="2"/>

  <!-- right: modernization, a magnifying glass over a mapped process -->
  <g transform="translate(1170,430)">
    <g fill="none" stroke="#10B981" stroke-width="5">
      <line x1="-70" y1="10" x2="-20" y2="-30"/>
      <line x1="-20" y1="-30" x2="30" y2="0"/>
      <line x1="30" y1="0" x2="80" y2="-40"/>
      <circle cx="-70" cy="10" r="5" fill="#10B981"/>
      <circle cx="-20" cy="-30" r="5" fill="#10B981"/>
      <circle cx="30" cy="0" r="5" fill="#10B981"/>
      <circle cx="80" cy="-40" r="5" fill="#10B981"/>
    </g>
    <g fill="none" stroke="#f5f5f7" stroke-width="6" stroke-linecap="round">
      <circle cx="10" cy="40" r="55"/>
      <line x1="49" y1="79" x2="95" y2="125"/>
    </g>
    <text x="0" y="180" text-anchor="middle" fill="#10B981" font-family="Arial, sans-serif" font-size="20" letter-spacing="2">MODERNIZATION</text>
  </g>

  <text x="865" y="760" text-anchor="middle" fill="#f5f5f7" font-family="Arial, sans-serif" font-size="30" font-weight="700" letter-spacing="0.5">
    Faster process, or the right one
  </text>
</svg>
