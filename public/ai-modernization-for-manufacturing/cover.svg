<svg width="1730" height="909" viewBox="0 0 1730 909" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow-mfg" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1730" height="909" fill="#0d0d0d"/>
  <rect width="1730" height="909" fill="url(#glow-mfg)"/>

  <!-- factory silhouette -->
  <g transform="translate(865,470)" fill="none" stroke="#10B981" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
    <path d="M-260,120 L-260,-20 L-160,40 L-160,-100 L-60,-40 L-60,-140 L60,-80 L60,120 Z"/>
    <line x1="-260" y1="120" x2="260" y2="120"/>
    <rect x="-200" y="20" width="60" height="100" />
    <rect x="20" y="20" width="40" height="100"/>
  </g>

  <!-- cycle time bar, echoing the diagnostic numbers -->
  <g transform="translate(1180,440)">
    <text x="0" y="-30" fill="#6b7280" font-family="Arial, sans-serif" font-size="16">ACTUAL</text>
    <rect x="0" y="-10" width="180" height="18" fill="#10B981" fill-opacity="0.85" rx="3"/>
    <text x="190" y="4" fill="#f5f5f7" font-family="Arial, sans-serif" font-size="16">55-70 days</text>
    <text x="0" y="46" fill="#6b7280" font-family="Arial, sans-serif" font-size="16">IDEAL</text>
    <rect x="0" y="66" width="76" height="18" fill="#34d399" fill-opacity="0.55" rx="3"/>
    <text x="86" y="80" fill="#f5f5f7" font-family="Arial, sans-serif" font-size="16">25-28 days</text>
  </g>

  <text x="865" y="740" text-anchor="middle" fill="#f5f5f7" font-family="Arial, sans-serif" font-size="30" font-weight="700" letter-spacing="0.5">
    The gap between ideal and actual, mapped
  </text>
</svg>
