<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>Three incidents, three different failure types</title>
  <rect x="0" y="0" width="900" height="320" fill="#fcfcfb"/>
  <text x="450" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="#0b0b0b">Three incidents, three different failure types</text>

  <g stroke="#e1e0d9" stroke-width="1">
    <line x1="300" y1="50" x2="300" y2="208"/>
    <line x1="590" y1="50" x2="590" y2="208"/>
  </g>

  <!-- Chevrolet: authority (categorical slot 1, blue) -->
  <g text-anchor="middle">
    <text x="160" y="68" font-size="15" font-weight="600" fill="#0b0b0b">Chevrolet</text>
    <text x="160" y="86" font-size="11.5" fill="#898781">November 2023</text>
    <rect x="85" y="102" width="150" height="28" rx="14" fill="none" stroke="#2a78d6" stroke-width="1.6"/>
    <text x="160" y="120" font-size="12" fill="#0b0b0b">Cause: authority</text>
    <text x="160" y="158" font-size="12" fill="#52514e">Bot promised a $76,000</text>
    <text x="160" y="174" font-size="12" fill="#52514e">truck for $1. Never honored,</text>
    <text x="160" y="190" font-size="12" fill="#52514e">but the screenshot hit 20M views.</text>
  </g>

  <!-- Air Canada: verification (categorical slot 2, orange) -->
  <g text-anchor="middle">
    <text x="450" y="68" font-size="15" font-weight="600" fill="#0b0b0b">Air Canada</text>
    <text x="450" y="86" font-size="11.5" fill="#898781">February 2024</text>
    <rect x="365" y="102" width="170" height="28" rx="14" fill="none" stroke="#eb6834" stroke-width="1.6"/>
    <text x="450" y="120" font-size="12" fill="#0b0b0b">Cause: verification</text>
    <text x="450" y="158" font-size="12" fill="#52514e">Bot invented a refund policy.</text>
    <text x="450" y="174" font-size="12" fill="#52514e">A tribunal ruled the airline</text>
    <text x="450" y="190" font-size="12" fill="#52514e">liable and ordered payment.</text>
  </g>

  <!-- DPD: scope (categorical slot 3, aqua) -->
  <g text-anchor="middle">
    <text x="740" y="68" font-size="15" font-weight="600" fill="#0b0b0b">DPD</text>
    <text x="740" y="86" font-size="11.5" fill="#898781">January 2024</text>
    <rect x="675" y="102" width="130" height="28" rx="14" fill="none" stroke="#1baf7a" stroke-width="1.6"/>
    <text x="740" y="120" font-size="12" fill="#0b0b0b">Cause: scope</text>
    <text x="740" y="158" font-size="12" fill="#52514e">Bot swore at a customer and</text>
    <text x="740" y="174" font-size="12" fill="#52514e">insulted its own employer.</text>
    <text x="740" y="190" font-size="12" fill="#52514e">Taken offline within a day.</text>
  </g>

  <text x="450" y="300" text-anchor="middle" font-size="12" fill="#898781">None of the three needed a smarter model. Each needed a boundary nobody had set.</text>
</svg>
