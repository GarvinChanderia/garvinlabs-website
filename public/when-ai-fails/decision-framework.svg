<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>The three questions, sorted into three zones</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a39f92"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="560" fill="#fcfcfb"/>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="600" fill="#0b0b0b">The three questions, sorted into three zones</text>

  <!-- ===== connectors (drawn first, sit behind nodes) ===== -->
  <g stroke="#a39f92" stroke-width="1.6" fill="none">
    <line x1="165" y1="128" x2="330" y2="180" marker-end="url(#arrow)"/>
    <line x1="450" y1="128" x2="450" y2="180" marker-end="url(#arrow)"/>
    <line x1="735" y1="128" x2="570" y2="180" marker-end="url(#arrow)"/>

    <line x1="450" y1="240" x2="450" y2="270" marker-end="url(#arrow)"/>

    <line x1="450" y1="270" x2="165" y2="316" marker-end="url(#arrow)"/>
    <line x1="450" y1="270" x2="450" y2="316" marker-end="url(#arrow)"/>
    <line x1="450" y1="270" x2="735" y2="316" marker-end="url(#arrow)"/>
  </g>

  <!-- ===== the three questions ===== -->
  <g text-anchor="middle">
    <rect x="40" y="58" width="250" height="70" rx="8" fill="#f2f1ee" stroke="#898781" stroke-width="1.4"/>
    <text x="165" y="88" font-size="13.5" font-weight="600" fill="#0b0b0b">Reversibility</text>
    <text x="165" y="107" font-size="11.5" fill="#52514e">Cheap to undo, or already sent?</text>

    <rect x="325" y="58" width="250" height="70" rx="8" fill="#f2f1ee" stroke="#898781" stroke-width="1.4"/>
    <text x="450" y="88" font-size="13.5" font-weight="600" fill="#0b0b0b">Stakes</text>
    <text x="450" y="107" font-size="11.5" fill="#52514e">Shrug, or liability?</text>

    <rect x="610" y="58" width="250" height="70" rx="8" fill="#f2f1ee" stroke="#898781" stroke-width="1.4"/>
    <text x="735" y="88" font-size="13.5" font-weight="600" fill="#0b0b0b">Verifiability</text>
    <text x="735" y="107" font-size="11.5" fill="#52514e">Does a person see it first?</text>
  </g>

  <!-- ===== merge node ===== -->
  <rect x="340" y="180" width="220" height="60" rx="8" fill="#eef4fc" stroke="#2a78d6" stroke-width="1.6"/>
  <text x="450" y="205" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0b0b0b">Run the task through</text>
  <text x="450" y="223" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0b0b0b">all three</text>

  <!-- ===== the three zones ===== -->
  <g>
    <!-- green -->
    <rect x="40" y="316" width="250" height="178" rx="8" fill="#f2f1ee" stroke="#c3c2b7" stroke-width="1.4"/>
    <rect x="40" y="316" width="250" height="7" rx="3.5" fill="#0ca30c"/>
    <circle cx="165" cy="340" r="9" fill="none" stroke="#0ca30c" stroke-width="2"/>
    <path d="M160,341 L163.5,344.5 L171,334.5" fill="none" stroke="#0ca30c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="165" y="364" text-anchor="middle" font-size="13.5" font-weight="600" fill="#0b0b0b">Green: AI runs alone</text>
    <text x="165" y="386" text-anchor="middle" font-size="11.5" fill="#52514e">Wrong here costs a few</text>
    <text x="165" y="402" text-anchor="middle" font-size="11.5" fill="#52514e">minutes, not a customer.</text>
    <line x1="65" y1="418" x2="265" y2="418" stroke="#e1e0d9" stroke-width="1"/>
    <text x="165" y="438" text-anchor="middle" font-size="11" fill="#898781">e.g. drafting a reply,</text>
    <text x="165" y="454" text-anchor="middle" font-size="11" fill="#898781">routing tickets, first drafts</text>

    <!-- yellow -->
    <rect x="325" y="316" width="250" height="178" rx="8" fill="#f2f1ee" stroke="#c3c2b7" stroke-width="1.4"/>
    <rect x="325" y="316" width="250" height="7" rx="3.5" fill="#fab219"/>
    <polygon points="450,330 460,349 440,349" fill="none" stroke="#fab219" stroke-width="2" stroke-linejoin="round"/>
    <line x1="450" y1="337" x2="450" y2="342.5" stroke="#fab219" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="450" cy="346" r="1" fill="#fab219"/>
    <text x="450" y="364" text-anchor="middle" font-size="13.5" font-weight="600" fill="#0b0b0b">Yellow: human approves</text>
    <text x="450" y="386" text-anchor="middle" font-size="11.5" fill="#52514e">AI drafts it, a person signs</text>
    <text x="450" y="402" text-anchor="middle" font-size="11.5" fill="#52514e">off before it goes out.</text>
    <line x1="350" y1="418" x2="550" y2="418" stroke="#e1e0d9" stroke-width="1"/>
    <text x="450" y="438" text-anchor="middle" font-size="11" fill="#898781">e.g. refund under a cap,</text>
    <text x="450" y="454" text-anchor="middle" font-size="11" fill="#898781">reorder suggestions</text>

    <!-- red -->
    <rect x="610" y="316" width="250" height="178" rx="8" fill="#f2f1ee" stroke="#c3c2b7" stroke-width="1.4"/>
    <rect x="610" y="316" width="250" height="7" rx="3.5" fill="#d03b3b"/>
    <polygon points="743.3,343.4 738.4,348.3 731.6,348.3 726.7,343.4 726.7,336.6 731.6,331.7 738.4,331.7 743.3,336.6" fill="none" stroke="#d03b3b" stroke-width="2" stroke-linejoin="round"/>
    <text x="735" y="364" text-anchor="middle" font-size="13.5" font-weight="600" fill="#0b0b0b">Red: not AI's call</text>
    <text x="735" y="386" text-anchor="middle" font-size="11.5" fill="#52514e">Reads as policy or a legal</text>
    <text x="735" y="402" text-anchor="middle" font-size="11.5" fill="#52514e">commitment. A person decides.</text>
    <line x1="635" y1="418" x2="835" y2="418" stroke="#e1e0d9" stroke-width="1"/>
    <text x="735" y="438" text-anchor="middle" font-size="11" fill="#898781">e.g. final pricing, refunds</text>
    <text x="735" y="454" text-anchor="middle" font-size="11" fill="#898781">above threshold</text>
  </g>

  <text x="450" y="524" text-anchor="middle" font-size="12" fill="#898781">Most viral AI failures: a yellow- or red-zone task, run as if it were green.</text>
</svg>
