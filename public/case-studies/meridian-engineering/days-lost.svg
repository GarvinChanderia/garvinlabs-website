<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>Days lost by process step</title>
  <rect x="0" y="0" width="640" height="320" fill="#fcfcfb"/>
  <text x="32" y="34" font-size="14" font-weight="600" fill="#0b0b0b">Where the days actually went</text>
  <text x="32" y="52" font-size="11.5" fill="#898781">Days over ideal, per process step</text>
  <text x="608" y="52" text-anchor="end" font-size="10" fill="#898781">Bar height = high end of range</text>

  <line x1="60" y1="270" x2="600" y2="270" stroke="#c3c2b7" stroke-width="1.2"/>

  <!-- Material availability: +9 to 10, use 10 -->
  <rect x="120" y="150" width="70" height="120" rx="6" fill="#10B981"/>
  <text x="155" y="140" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">+9&#8211;10</text>
  <text x="155" y="290" text-anchor="middle" font-size="11.5" fill="#52514e">Material</text>
  <text x="155" y="304" text-anchor="middle" font-size="11.5" fill="#52514e">availability</text>

  <!-- Dispatch + documentation: +2 to 15, use 15 as tallest -->
  <rect x="285" y="90" width="70" height="180" rx="6" fill="#10B981"/>
  <text x="320" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">+2&#8211;15</text>
  <text x="320" y="290" text-anchor="middle" font-size="11.5" fill="#52514e">Dispatch +</text>
  <text x="320" y="304" text-anchor="middle" font-size="11.5" fill="#52514e">documentation</text>

  <!-- Finishing: +2 to 3 -->
  <rect x="450" y="234" width="70" height="36" rx="6" fill="#10B981"/>
  <text x="485" y="224" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">+2&#8211;3</text>
  <text x="485" y="290" text-anchor="middle" font-size="11.5" fill="#52514e">Finishing</text>
</svg>
