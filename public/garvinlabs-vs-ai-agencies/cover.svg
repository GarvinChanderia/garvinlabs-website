<svg width="1730" height="909" viewBox="0 0 1730 909" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow-vs2" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1730" height="909" fill="#0d0d0d"/>
  <rect width="1730" height="909" fill="url(#glow-vs2)"/>

  <!-- top path: tool first, straight to a sale -->
  <g stroke="#6b7280" stroke-width="5" fill="none" stroke-linecap="round">
    <line x1="480" y1="330" x2="1250" y2="330" marker-end="url(#arrow-grey)"/>
  </g>
  <g fill="#6b7280" font-family="Arial, sans-serif" font-size="18" letter-spacing="1">
    <text x="480" y="300">TOOL</text>
    <text x="1170" y="300">SALE</text>
  </g>

  <!-- bottom path: map, diagnose, then build -->
  <g stroke="#10B981" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M480,560 L700,560 L820,500 L940,560 L1060,500 L1250,560"/>
  </g>
  <g fill="#10B981" font-family="Arial, sans-serif" font-size="18" letter-spacing="1">
    <text x="470" y="600" text-anchor="middle">MAP</text>
    <text x="820" y="470" text-anchor="middle">DIAGNOSE</text>
    <text x="1250" y="600" text-anchor="end">BUILD</text>
  </g>
  <g fill="#10B981">
    <circle cx="480" cy="560" r="7"/>
    <circle cx="700" cy="560" r="7"/>
    <circle cx="820" cy="500" r="7"/>
    <circle cx="940" cy="560" r="7"/>
    <circle cx="1060" cy="500" r="7"/>
    <circle cx="1250" cy="560" r="7"/>
  </g>
  <g fill="#6b7280">
    <circle cx="480" cy="330" r="7"/>
    <circle cx="1250" cy="330" r="7"/>
  </g>

  <text x="865" y="720" text-anchor="middle" fill="#f5f5f7" font-family="Arial, sans-serif" font-size="30" font-weight="700" letter-spacing="0.5">
    Two ways to sequence the same work
  </text>
</svg>
