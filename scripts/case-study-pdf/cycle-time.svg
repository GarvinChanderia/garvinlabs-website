<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 664 260" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>Order cycle: actual vs ideal, in days</title>
  <rect x="0" y="0" width="664" height="260" fill="#fcfcfb"/>
  <text x="32" y="34" font-size="14" font-weight="600" fill="#0b0b0b">Order cycle: what I found vs. what&#8217;s possible</text>

  <g transform="translate(32,0)">
    <!-- axis -->
    <g stroke="#e1e0d9" stroke-width="1">
      <line x1="140" y1="70" x2="140" y2="220"/>
      <line x1="280" y1="70" x2="280" y2="220"/>
      <line x1="420" y1="70" x2="420" y2="220"/>
      <line x1="560" y1="70" x2="560" y2="220"/>
    </g>
    <g font-size="10.5" fill="#898781">
      <text x="0" y="235" text-anchor="middle">0</text>
      <text x="140" y="235" text-anchor="middle">20 days</text>
      <text x="280" y="235" text-anchor="middle">40 days</text>
      <text x="420" y="235" text-anchor="middle">60 days</text>
      <text x="560" y="235" text-anchor="middle">80 days</text>
    </g>
    <line x1="0" y1="220" x2="600" y2="220" stroke="#c3c2b7" stroke-width="1.2"/>
    <line x1="0" y1="70" x2="0" y2="220" stroke="#c3c2b7" stroke-width="1.2"/>

    <!-- ideal bar: 25-28 days, scale 7px/day, origin x=0 -->
    <rect x="0" y="100" width="196" height="30" rx="6" fill="#c3c2b7"/>
    <text x="204" y="120" font-size="12.5" font-weight="600" fill="#52514e">Ideal: 25&#8211;28 days</text>
    <text x="0" y="92" font-size="11" fill="#898781">Target range</text>

    <!-- actual bar: 55-70 days -->
    <rect x="0" y="160" width="490" height="30" rx="6" fill="#10B981"/>
    <text x="498" y="180" font-size="12.5" font-weight="700" fill="#0b0b0b">Actual: 55&#8211;70 days</text>
    <text x="0" y="152" font-size="11" fill="#898781">What I measured from real job records</text>
  </g>
</svg>
